<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG Bayesiano - Edición Multi-Nivel</title>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
        body { 
            margin: 0; padding: 0; background-color: #0b0c10; color: #fff; 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        
        #game-wrapper {
            position: relative;
            width: 100%; height: 100%;
            max-width: 900px;
            max-height: 600px;
            aspect-ratio: 16/9;
            background: #000;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        canvas { 
            display: block; 
            width: 100%; height: 100%; 
            image-rendering: pixelated; 
        }

        /* --- CONTROLES MÓVILES --- */
        #dpad {
            position: absolute; bottom: 20px; left: 20px;
            width: 120px; height: 120px;
            display: none;
            opacity: 0.5; z-index: 50;
        }
        .dbtn { 
            position: absolute; background: rgba(255,255,255,0.2); 
            border: 2px solid #fff; border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
        }
        .dbtn svg { width: 20px; height: 20px; fill: #fff; }
        .dbtn:active { background: rgba(255,255,255,0.5); }
        #btn-up { top: 0; left: 40px; width: 40px; height: 40px; }
        #btn-down { bottom: 0; left: 40px; width: 40px; height: 40px; }
        #btn-left { top: 40px; left: 0; width: 40px; height: 40px; }
        #btn-right { top: 40px; right: 0; width: 40px; height: 40px; }
        
        #btn-action {
            position: absolute; bottom: 30px; right: 30px;
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(168,85,247,0.3); border: 3px solid #a855f7;
            display: none; align-items: center; justify-content: center;
            font-weight: bold; font-size: 24px; color: #fff; z-index: 50;
            opacity: 0.7; box-shadow: 0 0 10px #a855f7;
        }
        #btn-action:active { background: rgba(168,85,247,0.7); transform: scale(0.95); }

        /* --- UI & MODALS --- */
        #ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 100; }
        
        #hud { position: absolute; top: 15px; left: 15px; display: flex; gap: 8px; }
        .gem-box { 
            width: 28px; height: 28px; border: 2px solid #333; background: #1a1a24;
            display: flex; justify-content: center; align-items: center; border-radius: 4px;
            opacity: 0.3; transition: all 0.3s;
        }
        @keyframes gemPop {
            0% { transform: scale(1); box-shadow: 0 0 10px var(--c); }
            50% { transform: scale(1.6); box-shadow: 0 0 30px #fff; border-color: #fff; }
            100% { transform: scale(1); box-shadow: 0 0 10px var(--c); }
        }
        .gem-box.active { opacity: 1; border-color: var(--c); box-shadow: 0 0 10px var(--c); }
        .gem-box.collected { animation: gemPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .gem-icon { width: 14px; height: 14px; transform: rotate(45deg); background: var(--c); }

        .modal-bg {
            position: absolute; inset: 0; background: rgba(0,0,0,0.8);
            display: none; align-items: center; justify-content: center; pointer-events: auto;
            transition: opacity 0.18s ease;
        }
        .modal-bg.hidden { opacity: 0; pointer-events: none; }
        
        .modal {
            background: #1e1e2f; border: 4px solid #a855f7; border-radius: 8px;
            padding: 20px; width: 85%; max-width: 500px;
            color: #e2e8f0; position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .modal.danger { border-color: #ef4444; }
        .modal.danger h2 { color: #ef4444; }
        
        h2 { margin: 0 0 15px 0; color: #a855f7; font-size: clamp(18px, 4vw, 24px); text-transform: uppercase; }
        p { font-size: clamp(14px, 3vw, 16px); line-height: 1.5; margin-bottom: 20px; min-height: 48px; }
        
        .options { display: flex; flex-direction: column; gap: 10px; }
        .btn {
            background: #2d2d44; color: #fff; border: 2px solid #5a5a7a; border-radius: 6px;
            padding: 12px; cursor: pointer; font-family: inherit; font-size: clamp(12px, 2.5vw, 15px);
            text-align: left; transition: all 0.2s;
        }
        .btn:hover, .btn:active { background: #3d3d5c; border-color: #a855f7; }
        .btn.center { text-align: center; background: #a855f7; border-color: #d8b4fe; font-weight: bold; }
        .btn.center:hover, .btn.center:active { background: #9333ea; }

        .door-glyph {
            position: absolute; color: #fff; font-size: 10px; font-weight: bold;
            background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px;
            border: 1px solid currentColor; white-space: nowrap; pointer-events: none;
            transform: translate(-50%, -100%);
        }

        #rotate-msg {
            display: none; position: fixed; inset: 0; background: #000; z-index: 999;
            color: #fff; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        @media (orientation: portrait) {
            #rotate-msg { display: flex; }
            #game-wrapper { display: none; }
        }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(3px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
    </style>
</head>

/* === AUDIO SYSTEM === */
let audioCtx = null;
let ambientOsc1 = null, ambientOsc2 = null;
let ambientStarted = false;

function initAudio() {
    if(ambientStarted) return;
    try {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        ambientStarted = true;
    } catch(e) {}
}

function playSound(type) {
    if(!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        
        if(type === 'step') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(80, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        } else if(type === 'gem') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } else if(type === 'dragon') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 1.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
            osc.start(); osc.stop(audioCtx.currentTime + 1.2);
        }
    } catch(e) {}
}

function playBlip() {
    if(!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(400 + Math.random()*200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.start(); osc.stop(audioCtx.currentTime + 0.03);
    } catch(e) {}
}

/* === PARTICLES === */
const MAX_PARTICLES = 120;
const particles = Array.from({ length: MAX_PARTICLES }, () => ({
    x:0, y:0, vx:0, vy:0, life:0, maxLife:1, color:'#fff', size:2, active:false, type:'fx' // fx o dust
}));

function emitParticles(x, y, count, colors) {
    let spawned = 0;
    for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
        const p = particles[i];
        if (p.active && p.type!=='dust') continue;
        p.active = true; p.type = 'fx';
        p.x = x; p.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = 40 + Math.random() * 90;
        p.vx = Math.cos(angle) * speed; p.vy = Math.sin(angle) * speed - 60;
        p.life = 0.55 + Math.random() * 0.35; p.maxLife = p.life;
        p.color = colors[Math.floor(Math.random() * colors.length)];
        p.size = 1.5 + Math.random() * 2;
        spawned++;
    }
}

function spawnDust(p) {
    p.active = true;
    const def = LEVEL_DEFS[currentLevelId];
    p.type = def.pType || 'dust';
    p.x = Math.random() * def.mapW * TSIZE;
    p.y = Math.random() * def.mapH * TSIZE;
    
    if(p.type === 'lava') {
        p.vx = (Math.random()-0.5)*15; p.vy = -20 - Math.random()*30;
        p.color = Math.random() > 0.5 ? '#ef4444' : '#fbbf24';
    } else if(p.type === 'magic') {
        p.vx = (Math.random()-0.5)*40; p.vy = (Math.random()-0.5)*40;
        p.color = Math.random() > 0.5 ? '#a855f7' : '#fff';
    } else {
        p.vx = -10 + Math.random()*20; p.vy = -15 + Math.random()*10;
        p.color = '#ffffff';
    }
    p.life = 2 + Math.random() * 3; p.maxLife = p.life;
    p.size = 1 + Math.random();
}

function updateParticles(dt) {
    for (const p of particles) {
        if (!p.active) continue;
        p.x += p.vx * dt; p.y += p.vy * dt;
        if(p.type === 'fx') p.vy += 140 * dt;
        p.life -= dt;
        if (p.life <= 0) {
            p.active = false;
            if(p.type === 'dust' && gameState === 'PLAY') spawnDust(p);
        }
    }
}

function drawParticles(scx, scy) {
    for (const p of particles) {
        if (!p.active) continue;
        const alpha = p.type === 'dust' ? (p.life/p.maxLife)*0.15 : (p.life/p.maxLife);
        ctx.save();
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.round(p.x - scx), Math.round(p.y - scy), Math.ceil(p.size), Math.ceil(p.size));
        ctx.restore();
    }
}

function renderSprite(ctx, sprite, x, y, flipX=false, scale=2, tint=null) {
    x = Math.round(x); y = Math.round(y);
    ctx.save();
    ctx.translate(x, y);
    if(flipX) ctx.scale(-1, 1);
    
    if(tint) { ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.8; }

    const w = sprite[0].length;
    const h = sprite.length;
    const offX = -Math.round((w * scale) / 2);
    const offY = -(h * scale);
    
    for(let r=0; r<h; r++) {
        for(let c=0; c<w; c++) {
            const char = sprite[r][c];
            if(char !== '0') {
                ctx.fillStyle = tint ? tint : PAL[char];
                ctx.fillRect(offX + c*scale, offY + r*scale, scale, scale);
            }
        }
    }
    ctx.restore();
}

                if(o.y < TSIZE+o.r || o.y > this.mapH*TSIZE - TSIZE - o.r) o.vy *= -1;
                if(dist(player.x, player.y, o.x, o.y) < o.r + 10) {

let activeEntities = [];

/* === GAME STATE & INPUT === */
const keys = { w:0, a:0, s:0, d:0, action:0 };
const touches = { up:0, down:0, left:0, right:0, action:0 };

window.addEventListener('keydown', e => {
    if(['w','ArrowUp'].includes(e.key)) keys.w = 1;
    if(['s','ArrowDown'].includes(e.key)) keys.s = 1;
    if(['a','ArrowLeft'].includes(e.key)) keys.a = 1;
    if(['d','ArrowRight'].includes(e.key)) keys.d = 1;
    if(['e','Enter',' '].includes(e.key)) keys.action = 1;
});
window.addEventListener('keyup', e => {
    if(['w','ArrowUp'].includes(e.key)) keys.w = 0;
    if(['s','ArrowDown'].includes(e.key)) keys.s = 0;
    if(['a','ArrowLeft'].includes(e.key)) keys.a = 0;
    if(['d','ArrowRight'].includes(e.key)) keys.d = 0;
    if(['e','Enter',' '].includes(e.key)) keys.action = 0;
});

function bindBtn(id, key) {
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('touchstart', e=>{ e.preventDefault(); touches[key]=1; });
    el.addEventListener('touchend', e=>{ e.preventDefault(); touches[key]=0; });
}
bindBtn('btn-up', 'up'); bindBtn('btn-down', 'down');
bindBtn('btn-left', 'left'); bindBtn('btn-right', 'right');
bindBtn('btn-action', 'action');

const player = {
    x: 0, y: 0, w: 16, h: 10, speed: 160, dir: 1, moving: false, animTimer: 0,
    update: function(dt) {
        let dx = 0, dy = 0;
        if(keys.w || touches.up) dy -= 1;
        if(keys.s || touches.down) dy += 1;
        if(keys.a || touches.left) dx -= 1;
        if(keys.d || touches.right) dx += 1;

        if(dx !== 0 && dy !== 0) { const l = Math.sqrt(dx*dx+dy*dy); dx/=l; dy/=l; }

        if(dx < 0) this.dir = -1; else if(dx > 0) this.dir = 1;
        this.moving = (dx!==0 || dy!==0);
        
        if(this.moving) {
            this.animTimer += dt * 12;
            stepSoundTimer -= dt;
            if(stepSoundTimer <= 0) {
                playSound('step');
                stepSoundTimer = 0.32;
            }
        } else {
            this.animTimer = 0;
            stepSoundTimer = 0;
        }

        let nx = this.x + dx * this.speed * dt;
        let ny = this.y + dy * this.speed * dt;

        const def = LEVEL_DEFS[currentLevelId];
        if(nx < TSIZE + this.w/2) nx = TSIZE + this.w/2;
        if(nx > def.mapW*TSIZE - TSIZE - this.w/2) nx = def.mapW*TSIZE - TSIZE - this.w/2;
        if(ny < TSIZE + this.h) ny = TSIZE + this.h;
        if(ny > def.mapH*TSIZE - TSIZE) ny = def.mapH*TSIZE - TSIZE;

        this.x = nx; this.y = ny;
    },
    draw: function(ctx, cx, cy) {
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath(); ctx.ellipse(this.x - cx, this.y - cy, 14, 5, 0, 0, Math.PI*2); ctx.fill();

        const bob = this.moving ? (Math.floor(this.animTimer)%2 === 0 ? 0 : 2) : 0;

        if(wizardPruebaLoaded) {
            const dw = 48, dh = 58;
            ctx.save();
            if(this.dir === -1) {
                ctx.translate(this.x - cx, 0); ctx.scale(-1, 1);
                ctx.drawImage(wizardPrueba, -dw/2, this.y - cy - dh + 8, dw, dh);
            } else {
                ctx.drawImage(wizardPrueba, this.x - cx - dw/2, this.y - cy - dh + 8, dw, dh);
            }
            ctx.restore();
        } else if(!wizardLoaded) {
            const frame = (Math.floor(this.animTimer) % 2 === 0) ? SPRITES.wizard : SPRITES.wizard_walk;
            renderSprite(ctx, frame, this.x - cx, this.y - cy - bob, this.dir === -1);
        } else {
            let anim = WIZ_ANIMS.idle;
            let frame = Math.floor(this.animTimer) % anim.frames;
            if(this.moving) { anim = WIZ_ANIMS.walk; frame = Math.floor(this.animTimer) % anim.frames; }

            const sx = anim.x + (frame * anim.step);
            const sy = anim.y;
            const sw = anim.w;
            const sh = anim.h;
            const dw = 42, dh = 42; // Tamaño ajustado para 32x32

            ctx.save();
            if(this.dir === -1) {
                ctx.translate(this.x - cx, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(wizardSheet, sx, sy, sw, sh, -dw/2, this.y - cy - dh + 8, dw, dh);
            } else {
                ctx.drawImage(wizardSheet, sx, sy, sw, sh, this.x - cx - dw/2, this.y - cy - dh + 8, dw, dh);
            }
            ctx.restore();
        }
        
        // Staff Glow
        if (staffGlowTime > 0) {
            const tipX = Math.round(this.x - cx) + (this.dir === 1 ? 9 : -9);
            const tipY = Math.round(this.y - cy) - 50 - bob;
            const alpha = Math.min(1, staffGlowTime) * (0.6 + 0.4 * Math.sin(performance.now() / 120));
            
            const grd = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, 16);
            grd.addColorStop(0, `rgba(251,191,36,${alpha})`);
            grd.addColorStop(0.4, `rgba(251,191,36,${alpha * 0.5})`);
            grd.addColorStop(1, 'rgba(251,191,36,0)');
            ctx.fillStyle = grd;
            ctx.fillRect(tipX - 16, tipY - 16, 32, 32);
            ctx.fillStyle = `rgba(255,240,100,${alpha})`;
            ctx.fillRect(tipX - 2, tipY - 2, 4, 4);
        }
    }
};

/* === UI LOGIC === */
const modalBg = document.getElementById('modal-container');
const modalBox = document.getElementById('modal-box');
const mTitle = document.getElementById('m-title');
const mText = document.getElementById('m-text');
const mOpts = document.getElementById('m-options');
const doorLabelsContainer = document.getElementById('door-labels-container');

let typewriterTimer = null;
let currentDialog = null;
let stepSoundTimer = 0;

function hasAllGems() { return gems.gem1 && gems.gem2 && gems.gem3 && gems.gem4 && gems.gem5; }
function dist(x1,y1,x2,y2) { return Math.sqrt((x2-x1)**2 + (y2-y1)**2); }

function triggerScreenShake() {
    shakeTime = 0.4;
    const gw = document.getElementById('game-wrapper');
    gw.classList.remove('shake');
    void gw.offsetWidth;
    gw.classList.add('shake');
    setTimeout(() => gw.classList.remove('shake'), 400);
}

function showModal(title, text, isDanger, options) {
    gameState = 'DIALOG';
    modalBg.classList.remove('hidden');
    modalBg.style.display = 'flex';
    void modalBg.offsetWidth;
    modalBg.style.opacity = '1';

    if(isDanger) modalBox.classList.add('danger'); else modalBox.classList.remove('danger');
    mTitle.textContent = title;
    mOpts.innerHTML = '';
    mText.innerHTML = '';

    let i = 0;
    let currentHTML = "";
    clearInterval(typewriterTimer);
    typewriterTimer = setInterval(() => {
        let isTag = false;
        if (text.charAt(i) === '<') {
            isTag = true;
            const end = text.indexOf('>', i);
            if (end !== -1) {
                currentHTML += text.substring(i, end + 1);
                i = end + 1;
            } else {
                currentHTML += text.charAt(i); i++;
            }
        } else {
            if(text.charAt(i) !== ' ' && gameState === 'DIALOG') playBlip();
            currentHTML += text.charAt(i);
            i++;
        }
        mText.innerHTML = currentHTML;
        
        if(i >= text.length) {
            clearInterval(typewriterTimer);
            renderOptions(options);
        }
    }, 18);
}

function hideModal(callback) {
    modalBg.style.opacity = '0';
    setTimeout(() => {
        modalBg.style.display = 'none';
        if (callback) callback();
    }, 190);
}

function renderOptions(options) {
    if(!options) {
        const b = document.createElement('button');
        b.className = 'btn center'; b.textContent = 'Continuar';
        b.onclick = () => hideModal(() => { if(gameState !== 'GAMEOVER') gameState = 'PLAY'; });
        mOpts.appendChild(b);
        return;
    }
    options.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'btn'; b.textContent = opt.t;
        b.onclick = () => handleAnswer(opt.c);
        mOpts.appendChild(b);
    });
}

function handleAnswer(isCorrect) {
    hideModal(() => {
        if(isCorrect) {
            if(currentDialog.type === 'chest') {
                const id = currentDialog.id;
                gems[id] = true;
                currentDialog.opened = true;
                const gemEl = document.getElementById(id);
                gemEl.classList.add('active');
                gemEl.classList.add('collected');
                
                const attempts = attemptCount[id] || 0;
                const tryTxt = attempts > 0 ? `<br><br><i>Conseguido tras ${attempts} intentos fallidos.</i>` : '';
                
                staffGlowTime = 3.0;
                playSound('gem');
                emitParticles(currentDialog.x, currentDialog.y, 40, ['#fbbf24','#fff','#38bdf8']);
                showModal('¡Correcto!', 'Adquieres una Gema de Sabiduría.' + tryTxt, false, null);
            } else if(currentDialog.type === 'dragon') {
                if(!currentDialog.phase2) {
                    currentDialog.phase2 = true;
                    showModal('¡El Dragón Tiembla!', currentDialog.phase2Text, true, currentDialog.phase2Opts);
                    triggerScreenShake();
                    shakeTime = 0.5;
                    playSound('dragon');
                    emitParticles(currentDialog.x, currentDialog.y, 60, ['#ef4444','#fbbf24','#fff']);
                } else {
                    emitParticles(currentDialog.x, currentDialog.y, 150, ['#fbbf24','#fff','#10b981','#38bdf8']);
                    currentDialog.defeated = true;
                    gameState = 'GAMEOVER';
                    playSound('gem');
                    showModal('¡VICTORIA ÉPICA!', '¡El poder de la Regularización y Validación Bayesiana ha purificado al Dragón del Overfitting!<br><br>Has dominado el Arte del Análisis Multinivel.', false, null);
                }
            }
        } else {
            triggerScreenShake();
            const id = currentDialog.id;
            if(id) attemptCount[id] = (attemptCount[id] || 0) + 1;
            
            const def = LEVEL_DEFS[currentLevelId];
            player.y = Math.min(player.y + 35, def.mapH * TSIZE - TSIZE);
            showModal('¡INCORRECTO!', 'Tus parámetros han sido sobreajustados... Inténtalo de nuevo.', true, null);
        }
    });
}

function gotoLevel(id) {
    if(id === 'dragon' && !hasAllGems()) {
        showModal('La Sala está Sellada', 'Necesitas las 5 Gemas de Sabiduría para enfrentarte al Dragón del Overfitting.', true, null);
        return;
    }
    initAudio(); // Inicia ambient si no ha iniciado
    gameState = 'TRANSITION';
    transitionPhase = 'out';
    pendingLevelId = id;
}

function loadLevel(id) {
    currentLevelId = id;
    const def = LEVEL_DEFS[id];
    activeEntities = JSON.parse(JSON.stringify(def.entities)); // deep copy state
    player.x = def.playerStart.x;
    player.y = def.playerStart.y;
    cameraX = camTargetX = Math.max(0, player.x - CW/2);
    cameraY = camTargetY = Math.max(0, player.y - CH/2);
    if(def.init) def.init();
    updateDoorLabels();
}

function updateDoorLabels() {
    doorLabelsContainer.innerHTML = '';
    const wrapperRect = document.getElementById('game-wrapper').getBoundingClientRect();
    const canvasRect = canvas.getBoundingClientRect();
    const scaleX = canvasRect.width / CW;
    const scaleY = canvasRect.height / CH;

    activeEntities.forEach(ent => {
        if(ent.type === 'door' && ent.label) {
            const div = document.createElement('div');
            div.className = 'door-glyph';
            div.textContent = ent.label;
            // Posicionamiento se hará en draw() dinámicamente
            div.id = 'lbl_' + ent.target;
            div.style.color = ent.color;
            doorLabelsContainer.appendChild(div);
        }
    });
}

function positionLabels(scx, scy) {
    const scale = canvas.getBoundingClientRect().width / CW;
    activeEntities.forEach(ent => {
        if(ent.type === 'door' && ent.label) {
            const el = document.getElementById('lbl_' + ent.target);
            if(el) {
                const px = (ent.x - scx) * scale;
                const py = (ent.y - scy - 40) * scale;
                el.style.left = px + 'px';
                el.style.top = py + 'px';
            }
        }
    });
}

/* === DRAWING UTILS === */
function drawLighting(ctx, scx, scy) {
    const def = LEVEL_DEFS[currentLevelId];
    
    // Vignette base con tinte temático
    const grad = ctx.createRadialGradient(CW/2, CH/2, CH/3, CW/2, CH/2, CW*0.8);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, def.light || 'rgba(0,0,0,0.6)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,CW,CH);

    // Spotlight del jugador
    const px = player.x - scx; const py = player.y - scy - 10;
    const pLight = ctx.createRadialGradient(px, py, 10, px, py, 150);
    pLight.addColorStop(0, 'rgba(255,255,255,0.12)');
    pLight.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = pLight;
    ctx.fillRect(px-150, py-150, 300, 300);

    // Luces de antorcha / ambiente pulsante
    if(currentLevelId === 'hub' || currentLevelId === 'level5' || currentLevelId === 'dragon') {
        const flicker = Math.sin(performance.now()/150)*0.04;
        const color = currentLevelId === 'hub' ? '255,160,40' : '255,50,50';
        const tPos = currentLevelId === 'hub' ? [[TSIZE*2, TSIZE*2], [TSIZE*28, TSIZE*2]] : [[player.x-scx, player.y-scy]];
        
        tPos.forEach(p => {
            const tx = p[0]; const ty = p[1];
            const tLight = ctx.createRadialGradient(tx, ty, 5, tx, ty, 130);
            tLight.addColorStop(0, `rgba(${color},${0.25+flicker})`);
            tLight.addColorStop(1, `rgba(${color},0)`);
            ctx.fillStyle = tLight;
            ctx.fillRect(tx-130, ty-130, 260, 260);
        });
    }
    ctx.globalCompositeOperation = 'source-over';
}

function drawMap(ctx, def, scx, scy) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CW, CH);
    
    const startCol = Math.max(0, Math.floor(scx / TSIZE));
    const endCol = Math.min(def.mapW, Math.ceil((scx + CW) / TSIZE));
    const startRow = Math.max(0, Math.floor(scy / TSIZE));
    const endRow = Math.min(def.mapH, Math.ceil((scy + CH) / TSIZE));

    for (let r = startRow; r < endRow; r++) {
        for (let c = startCol; c < endCol; c++) {
            const tx = c * TSIZE - scx;
            const ty = r * TSIZE - scy;
            
            const isWall = (r===0 || r===def.mapH-1 || c===0 || c===def.mapW-1);
            if(isWall) {
                // Cara frontal (Sombra)
                ctx.fillStyle = def.wall;
                ctx.fillRect(tx, ty, TSIZE, TSIZE);
                
                // Cara superior (Efecto 2.5D brillante)
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.fillRect(tx, ty, TSIZE, 6);
                
                // Sombra profunda interna
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(tx + 2, ty + 6, TSIZE - 4, TSIZE - 8);
            } else {
                ctx.fillStyle = ((r+c)%2===0) ? def.f0 : def.f1;
                ctx.fillRect(tx, ty, TSIZE, TSIZE);
                
                // Grid sutil
                ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                ctx.strokeRect(tx, ty, TSIZE, TSIZE);
            }
        }
    }
    
    if(def.decor) def.decor(ctx, scx, scy);
}

/* === MAIN LOOP === */
let actionPressed = false;

function update(dt) {
    if(gameState === 'TRANSITION') {
        if(transitionPhase === 'out') {
            transitionAlpha += dt * 3;
            if(transitionAlpha >= 1) {
                transitionAlpha = 1;
                loadLevel(pendingLevelId);
                transitionPhase = 'in';
            }
        } else if(transitionPhase === 'in') {
            transitionAlpha -= dt * 3;
            if(transitionAlpha <= 0) {
                transitionAlpha = 0;
                transitionPhase = null;
                if(!welcomeShown) {
                    welcomeShown = true;
                    showModal('Reto Bayesiano', 'Presiona cualquier tecla o toca la pantalla para iniciar.<br><br>Explora las 5 salas, recupera las Gemas de la Sabiduría Bayesiana y derrota al Dragón del Overfitting.', false, null);
                } else {
                    gameState = 'PLAY';
                }
            }
        }
        return;
    }

    if(gameState !== 'PLAY') return;

    initAudio();
    player.update(dt);
    if(staffGlowTime > 0) staffGlowTime = Math.max(0, staffGlowTime - dt);

    const def = LEVEL_DEFS[currentLevelId];
    if(def.update) def.update(dt);

    camTargetX = Math.max(0, Math.min(player.x - CW/2, def.mapW*TSIZE - CW));
    camTargetY = Math.max(0, Math.min(player.y - CH/2, def.mapH*TSIZE - CH));
    cameraX += (camTargetX - cameraX) * CAM_LERP;
    cameraY += (camTargetY - cameraY) * CAM_LERP;

    const isAction = keys.action || touches.action;
    if(isAction && !actionPressed) {
        actionPressed = true;
        for(let ent of activeEntities) {
            if(dist(player.x, player.y, ent.x, ent.y) < ent.r) {
                if(ent.type === 'door') {
                    if(ent.requiresAll && !hasAllGems()) {
                        showModal('La Sala está Sellada', 'Necesitas las 5 Gemas de Sabiduría para enfrentarte al Dragón del Overfitting.', true, null);
                    } else {
                        gotoLevel(ent.target);
                    }
                } else if(ent.type === 'chest' && !gems[ent.id]) {
                    currentDialog = ent;
                    showModal(ent.title, ent.text, false, ent.opts);
                } else if(ent.type === 'dragon' && !ent.defeated) {
                    currentDialog = ent;
                    showModal(ent.title, ent.text, true, ent.opts);
                }
            }
        }
    }
    if(!isAction) actionPressed = false;

    updateParticles(dt);
}

function draw() {
    const def = LEVEL_DEFS[currentLevelId];
    drawMap(ctx, def, cameraX, cameraY);

    activeEntities.forEach(ent => {
        if(ent.type === 'chest') {
            const frame = gems[ent.id] ? SPRITES.chest_open : SPRITES.chest;
            renderSprite(ctx, frame, ent.x - cameraX, ent.y - cameraY);
        } else if(ent.type === 'door') {
            const glow = Math.sin(performance.now()/200)*0.2 + 0.8;
            ctx.save();
            ctx.globalAlpha = glow;
            renderSprite(ctx, SPRITES.door, ent.x - cameraX, ent.y - cameraY, false, 2, ent.color);
            ctx.restore();
            // Brillo en el suelo
            ctx.fillStyle = ent.color; ctx.globalAlpha = 0.1 * glow;
            ctx.beginPath(); ctx.ellipse(ent.x - cameraX, ent.y - cameraY, 30, 10, 0, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1;
        } else if(ent.type === 'dragon' && !ent.defeated) {
            if(!dragonLoaded) {
                const tint = ent.phase2 ? '#ffaaaa' : null;
                renderSprite(ctx, SPRITES.dragon, ent.x - cameraX, ent.y - cameraY, false, 3.5, tint);
            } else {
                let anim = DRAGON_ANIMS.idle;
                if(ent.phase2) anim = DRAGON_ANIMS.attack;
                
                const frame = Math.floor(performance.now()/150) % anim.frames;
                const sx = anim.x + (frame * anim.step);
                const sy = anim.y;
                const dw = 160, dh = 160; // Tamaño imponente para el boss

                ctx.drawImage(dragonSheet, sx, sy, anim.w, anim.h, ent.x - cameraX - dw/2, ent.y - cameraY - dh + 20, dw, dh);
            }
            
            // Efecto aura dragón (más intenso)
            const aura = Math.sin(performance.now()/200)*0.2 + 0.3;
            ctx.fillStyle = ent.phase2 ? `rgba(255, 50, 50, ${aura})` : `rgba(239, 68, 68, ${aura})`;
            ctx.beginPath(); ctx.ellipse(ent.x - cameraX, ent.y - cameraY - 40, 80, 50, 0, 0, Math.PI*2); ctx.fill();
        }
    });

    player.draw(ctx, cameraX, cameraY);
    drawParticles(cameraX, cameraY);
    drawLighting(ctx, cameraX, cameraY);

    if(transitionAlpha > 0) {
        ctx.fillStyle = `rgba(0,0,0,${transitionAlpha})`;
        ctx.fillRect(0,0,CW,CH);
    }
    
    positionLabels(cameraX, cameraY);
}

function loop() {
    const now = performance.now();
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.1) dt = 0.1;
    accumulator += dt;
    while (accumulator >= FIXED_DT) {
        update(FIXED_DT);
        accumulator -= FIXED_DT;
    }
    draw();
    requestAnimationFrame(loop);
}

loadLevel('hub');
requestAnimationFrame(loop);

</script>
