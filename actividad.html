<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG Bayesiano - Edición Multi-Nivel</title>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
        body { 
            margin: 0; padding: 0; background-color: #0b0c10; color: #fff; 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        
        #game-wrapper {
            position: relative;
            width: 100%; height: 100%;
            max-width: 900px;
            max-height: 600px;
            aspect-ratio: 16/9;
            background: #000;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        canvas { 
            display: block; 
            width: 100%; height: 100%; 
            image-rendering: pixelated; 
        }

        /* --- CONTROLES MÓVILES --- */
        #dpad {
            position: absolute; bottom: 20px; left: 20px;
            width: 175px; height: 175px;
            display: none; opacity: 0.7; z-index: 300;
            touch-action: none;
        }
        .dbtn {
            position: absolute; background: rgba(30,30,60,0.55);
            border: 2px solid rgba(255,255,255,0.55); border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            touch-action: none; transition: background 0.08s;
        }
        .dbtn svg { width: 28px; height: 28px; fill: #fff; }
        .dbtn.pressed, .dbtn:active { background: rgba(168,85,247,0.55); border-color: #a855f7; }
        #btn-up    { top: 0;   left: 57px; width: 60px; height: 60px; }
        #btn-down  { bottom:0; left: 57px; width: 60px; height: 60px; }
        #btn-left  { top: 57px; left: 0;   width: 60px; height: 60px; }
        #btn-right { top: 57px; right:0;   width: 60px; height: 60px; }
        /* Centro decorativo del d-pad */
        #dpad::after {
            content:''; position:absolute; top:57px; left:57px;
            width:60px; height:60px; border-radius:8px;
            background:rgba(30,30,60,0.3); border:1px solid rgba(255,255,255,0.15);
        }

        #btn-action {
            position: absolute; bottom: 25px; right: 20px;
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(168,85,247,0.25); border: 3px solid #a855f7;
            display: none; align-items: center; justify-content: center;
            font-weight: bold; font-size: 28px; color: #fff; z-index: 300;
            opacity: 0.82; box-shadow: 0 0 16px #a855f7; touch-action: none;
        }
        #btn-action.pressed, #btn-action:active { background: rgba(168,85,247,0.7); transform: scale(0.93); }

        /* Toggle de gamepad (escritorio + tablets) */
        #gamepad-toggle {
            position: absolute; top: 10px; right: 10px;
            width: 34px; height: 34px; border-radius: 8px;
            background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; z-index: 300; opacity: 0.65;
            user-select: none;
        }
        #gamepad-toggle:hover { opacity: 1; }

        /* --- UI & MODALS --- */
        #ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 100; }
        
        #hud { position: absolute; top: 15px; left: 15px; display: flex; gap: 8px; }
        .gem-box { 
            width: 28px; height: 28px; border: 2px solid #333; background: #1a1a24;
            display: flex; justify-content: center; align-items: center; border-radius: 4px;
            opacity: 0.3; transition: all 0.3s;
        }
        @keyframes gemPop {
            0% { transform: scale(1); box-shadow: 0 0 10px var(--c); }
            50% { transform: scale(1.6); box-shadow: 0 0 30px #fff; border-color: #fff; }
            100% { transform: scale(1); box-shadow: 0 0 10px var(--c); }
        }
        .gem-box.active { opacity: 1; border-color: var(--c); box-shadow: 0 0 10px var(--c); }
        .gem-box.collected { animation: gemPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .gem-icon { width: 14px; height: 14px; transform: rotate(45deg); background: var(--c); }

        .modal-bg {
            position: absolute; inset: 0; background: rgba(0,0,0,0.8);
            display: none; align-items: center; justify-content: center; pointer-events: auto;
            transition: opacity 0.18s ease;
        }
        .modal-bg.hidden { opacity: 0; pointer-events: none; }
        
        .modal {
            background: #1e1e2f; border: 4px solid #a855f7; border-radius: 8px;
            padding: 20px; width: 85%; max-width: 500px;
            color: #e2e8f0; position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .modal.danger { border-color: #ef4444; }
        .modal.danger h2 { color: #ef4444; }
        
        h2 { margin: 0 0 15px 0; color: #a855f7; font-size: clamp(18px, 4vw, 24px); text-transform: uppercase; }
        p { font-size: clamp(14px, 3vw, 16px); line-height: 1.5; margin-bottom: 20px; min-height: 48px; }
        
        .options { display: flex; flex-direction: column; gap: 10px; }
        .btn {
            background: #2d2d44; color: #fff; border: 2px solid #5a5a7a; border-radius: 6px;
            padding: 12px; cursor: pointer; font-family: inherit; font-size: clamp(12px, 2.5vw, 15px);
            text-align: left; transition: all 0.2s;
        }
        .btn:hover, .btn:active { background: #3d3d5c; border-color: #a855f7; }
        .btn.center { text-align: center; background: #a855f7; border-color: #d8b4fe; font-weight: bold; }
        .btn.center:hover, .btn.center:active { background: #9333ea; }

        .door-glyph {
            position: absolute; color: #fff; font-size: 10px; font-weight: bold;
            background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px;
            border: 1px solid currentColor; white-space: nowrap; pointer-events: none;
            transform: translate(-50%, -100%);
        }

        #rotate-msg {
            display: none; position: fixed; inset: 0; background: #000; z-index: 999;
            color: #fff; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        @media (orientation: portrait) {
            #rotate-msg { display: flex; }
            #game-wrapper { display: none; }
        }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(3px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
    </style>
</head>
<body>

<div id="rotate-msg">
    <h2>Gira tu dispositivo</h2>
    <p>Para jugar necesitas usar tu teléfono en modo horizontal.</p>
</div>

<div id="game-wrapper">

    || new URLSearchParams(location.search).has('mobile');

    padVisible = v;

swordStoneImg.onload = gargoyleImg.onload = candelabraImg.onload = cageImg.onload = mushroomsImg.onload = castleDoorImg.onload = lampHangingBlueImg.onload = lampHangingBronzeImg.onload = () => { sceneryLoaded++; };

// Textura de pared (00.png) + spritesheet de cofres
const wallTexImg = new Image(); wallTexImg.src = 'assets/00.png';
let wallTexReady = false; wallTexImg.onload = () => { wallTexReady = true; };
const chestSheetImg = new Image(); chestSheetImg.src = 'assets/chests-small-alpha.png';
let chestSheetReady = false; chestSheetImg.onload = () => { chestSheetReady = true; };
const CHEST_FRAME_W = 29; // 117px / 4 frames ≈ 29px
const CHEST_FRAME_H = 32;
const CHEST_SCALE = 2.2;

function drawChestSprite(ctx, wx, wy, opened) {
    if(!chestSheetReady) return;
    const frameIdx = opened ? 3 : 0; // frame 0=cerrado, frame 3=abierto
    const fw = CHEST_FRAME_W * CHEST_SCALE;
    const fh = CHEST_FRAME_H * CHEST_SCALE;
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(chestSheetImg,
        frameIdx * CHEST_FRAME_W, 0, CHEST_FRAME_W, CHEST_FRAME_H,
        wx - fw/2, wy - fh, fw, fh);
    // Glow dorado cuando está abierto
    if(opened) {
        const glow = 0.3 + Math.abs(Math.sin(performance.now()/400)) * 0.3;
        const g = ctx.createRadialGradient(wx, wy - fh/2, 0, wx, wy - fh/2, 30);
        g.addColorStop(0, `rgba(251,191,36,${glow})`);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(wx, wy - fh/2, 30, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
}

/* === AUDIO SYSTEM === */
let audioCtx = null;
let ambientOsc1 = null, ambientOsc2 = null;
let ambientStarted = false;

function initAudio() {
    if(ambientStarted) return;
    try {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        ambientStarted = true;
    } catch(e) {}
}

function playSound(type) {
    if(!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        
        if(type === 'step') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(80, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        } else if(type === 'gem') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } else if(type === 'dragon') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 1.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
            osc.start(); osc.stop(audioCtx.currentTime + 1.2);
        }
    } catch(e) {}
}

function playBlip() {
    if(!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(400 + Math.random()*200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.start(); osc.stop(audioCtx.currentTime + 0.03);
    } catch(e) {}
}

/* === PARTICLES === */
const MAX_PARTICLES = 120;
const particles = Array.from({ length: MAX_PARTICLES }, () => ({
    x:0, y:0, vx:0, vy:0, life:0, maxLife:1, color:'#fff', size:2, active:false, type:'fx' // fx o dust
}));

function emitParticles(x, y, count, colors) {
    let spawned = 0;
    for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
        const p = particles[i];
        if (p.active && p.type!=='dust') continue;
        p.active = true; p.type = 'fx';
        p.x = x; p.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = 40 + Math.random() * 90;
        p.vx = Math.cos(angle) * speed; p.vy = Math.sin(angle) * speed - 60;
        p.life = 0.55 + Math.random() * 0.35; p.maxLife = p.life;
        p.color = colors[Math.floor(Math.random() * colors.length)];
        p.size = 1.5 + Math.random() * 2;
        spawned++;
    }
}

function spawnDust(p) {
    p.active = true;
    const def = LEVEL_DEFS[currentLevelId];
    p.type = def.pType || 'dust';
    p.x = Math.random() * def.mapW * TSIZE;
    p.y = Math.random() * def.mapH * TSIZE;
    
    if(p.type === 'lava') {
        p.vx = (Math.random()-0.5)*15; p.vy = -20 - Math.random()*30;
        p.color = Math.random() > 0.5 ? '#ef4444' : '#fbbf24';
    } else if(p.type === 'magic') {
        p.vx = (Math.random()-0.5)*40; p.vy = (Math.random()-0.5)*40;
        p.color = Math.random() > 0.5 ? '#a855f7' : '#fff';
    } else {
        p.vx = -10 + Math.random()*20; p.vy = -15 + Math.random()*10;
        p.color = '#ffffff';
    }
    p.life = 2 + Math.random() * 3; p.maxLife = p.life;
    p.size = 1 + Math.random();
}

function updateParticles(dt) {
    for (const p of particles) {
        if (!p.active) continue;
        p.x += p.vx * dt; p.y += p.vy * dt;
        if(p.type === 'fx') p.vy += 140 * dt;
        p.life -= dt;
        if (p.life <= 0) {
            p.active = false;
            if(p.type === 'dust' && gameState === 'PLAY') spawnDust(p);
        }
    }
}

function drawParticles(scx, scy) {
    for (const p of particles) {
        if (!p.active) continue;
        const alpha = p.type === 'dust' ? (p.life/p.maxLife)*0.15 : (p.life/p.maxLife);
        ctx.save();
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.round(p.x - scx), Math.round(p.y - scy), Math.ceil(p.size), Math.ceil(p.size));
        ctx.restore();
    }
}

function renderSprite(ctx, sprite, x, y, flipX=false, scale=2, tint=null) {
    x = Math.round(x); y = Math.round(y);
    ctx.save();
    ctx.translate(x, y);
    if(flipX) ctx.scale(-1, 1);
    
    if(tint) { ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.8; }

    const w = sprite[0].length;
    const h = sprite.length;
    const offX = -Math.round((w * scale) / 2);
    const offY = -(h * scale);
    
    for(let r=0; r<h; r++) {
        for(let c=0; c<w; c++) {
            const char = sprite[r][c];
            if(char !== '0') {
                ctx.fillStyle = tint ? tint : PAL[char];
                ctx.fillRect(offX + c*scale, offY + r*scale, scale, scale);
            }
        }
    }
    ctx.restore();
}

            if(player.x > midX + 15) player.x -= 190 * dt;

            // Viento cada ~5s
            this.windTimer -= dt;
            if(this.windTimer <= 0 && this.windActive === 0) {

                this.windActive = 1;

/* === GAME STATE & INPUT === */
const keys = { w:0, a:0, s:0, d:0, action:0 };
const touches = { up:0, down:0, left:0, right:0, action:0 };

window.addEventListener('keydown', e => {
    if(['w','ArrowUp'].includes(e.key)) keys.w = 1;
    if(['s','ArrowDown'].includes(e.key)) keys.s = 1;
    if(['a','ArrowLeft'].includes(e.key)) keys.a = 1;
    if(['d','ArrowRight'].includes(e.key)) keys.d = 1;
    if(['e','Enter',' '].includes(e.key)) keys.action = 1;
});
window.addEventListener('keyup', e => {
    if(['w','ArrowUp'].includes(e.key)) keys.w = 0;
    if(['s','ArrowDown'].includes(e.key)) keys.s = 0;
    if(['a','ArrowLeft'].includes(e.key)) keys.a = 0;
    if(['d','ArrowRight'].includes(e.key)) keys.d = 0;
    if(['e','Enter',' '].includes(e.key)) keys.action = 0;
});
window.addEventListener('blur', () => { 
    for(let k in keys) keys[k] = 0; 
    for(let k in touches) touches[k] = 0;
});

// Mapeo id→key para lookup en touchmove
const btnMap = { 'btn-up':'up','btn-down':'down','btn-left':'left','btn-right':'right','btn-action':'action' };
const btnEls = {};
Object.keys(btnMap).forEach(id => { btnEls[id] = document.getElementById(id); });

function setTouch(key, val) {
    if(touches[key] === val) return;
    touches[key] = val;
    const el = Object.entries(btnMap).find(([,k])=>k===key)?.[0];
    if(el && btnEls[el]) btnEls[el].classList.toggle('pressed', val===1);
    if(val===1) haptic(22);
}

function bindBtn(id, key) {
    const el = btnEls[id]; if(!el) return;
    el.addEventListener('touchstart', e=>{ e.preventDefault(); setTouch(key,1); }, {passive:false});
    el.addEventListener('touchend',   e=>{ e.preventDefault(); setTouch(key,0); }, {passive:false});
    el.addEventListener('touchcancel',e=>{ setTouch(key,0); });
}
Object.entries(btnMap).forEach(([id,key]) => bindBtn(id, key));

// touchmove global: detectar deslizamiento entre botones d-pad
document.getElementById('dpad').addEventListener('touchmove', e => {
    e.preventDefault();
    const dpadKeys = ['up','down','left','right'];
    // Resetear todos
    dpadKeys.forEach(k => setTouch(k, 0));
    // Activar el botón que está bajo cada punto de toque
    Array.from(e.touches).forEach(t => {
        Object.entries(btnEls).forEach(([id, el]) => {
            if(!el || id==='btn-action') return;
            const r = el.getBoundingClientRect();
            if(t.clientX >= r.left && t.clientX <= r.right && t.clientY >= r.top && t.clientY <= r.bottom) {
                setTouch(btnMap[id], 1);
            }
        });
    });
}, {passive:false});

const player = {
    x: 0, y: 0, w: 16, h: 10, speed: 160, dir: 1, moving: false, animTimer: 0,
    update: function(dt) {
        let dx = 0, dy = 0;
        if(keys.w || touches.up) dy -= 1;
        if(keys.s || touches.down) dy += 1;
        if(keys.a || touches.left) dx -= 1;
        if(keys.d || touches.right) dx += 1;

        if(dx !== 0 && dy !== 0) { const l = Math.sqrt(dx*dx+dy*dy); dx/=l; dy/=l; }

        if(dx < 0) this.dir = -1; else if(dx > 0) this.dir = 1;
        this.moving = (dx!==0 || dy!==0);
        
        if(this.moving) {
            this.animTimer += dt * 12;
            stepSoundTimer -= dt;
            if(stepSoundTimer <= 0) {
                playSound('step');
                stepSoundTimer = 0.32;
            }
        } else {
            this.animTimer = 0;
            stepSoundTimer = 0;
        }

        // Guardar posición anterior (usada por colisión de muros de nivel)
        this.oldX = this.x; this.oldY = this.y;

        let nx = this.x + dx * this.speed * dt;
        let ny = this.y + dy * this.speed * dt;

        const def = LEVEL_DEFS[currentLevelId];
        if(nx < TSIZE + this.w/2) nx = TSIZE + this.w/2;
        if(nx > def.mapW*TSIZE - TSIZE - this.w/2) nx = def.mapW*TSIZE - TSIZE - this.w/2;
        if(ny < TSIZE + this.h) ny = TSIZE + this.h;
        if(ny > def.mapH*TSIZE - TSIZE) ny = def.mapH*TSIZE - TSIZE;

        this.x = nx; this.y = ny;
    },
    draw: function(ctx, cx, cy) {
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath(); ctx.ellipse(this.x - cx, this.y - cy, 14, 5, 0, 0, Math.PI*2); ctx.fill();

        const bob = this.moving ? (Math.floor(this.animTimer)%2 === 0 ? 0 : 2) : 0;

        if(wizardPruebaLoaded) {
            let img = wizardPrueba;
            if(this.moving && wizardWalkLoaded >= 2) {
                // Ciclo de 4 pasos para naturalidad: 0:Frente, 1:Walk1, 2:Frente, 3:Walk2
                const step = Math.floor(this.animTimer / 1.5) % 4;
                if(step === 1) img = wizardWalk1;
                else if(step === 3) img = wizardWalk2;
                else img = wizardPrueba;
            }
            
            const dw = 48, dh = 58;
            ctx.save();
            if(this.dir === -1) {
                ctx.translate(this.x - cx, 0); ctx.scale(-1, 1);
                ctx.drawImage(img, -dw/2, this.y - cy - dh + 8, dw, dh);
            } else {
                ctx.drawImage(img, this.x - cx - dw/2, this.y - cy - dh + 8, dw, dh);
            }
            ctx.restore();
        } else if(!wizardLoaded) {
            const frame = (Math.floor(this.animTimer) % 2 === 0) ? SPRITES.wizard : SPRITES.wizard_walk;
            renderSprite(ctx, frame, this.x - cx, this.y - cy - bob, this.dir === -1);
        } else {
            let anim = WIZ_ANIMS.idle;
            let frame = Math.floor(this.animTimer) % anim.frames;
            if(this.moving) { anim = WIZ_ANIMS.walk; frame = Math.floor(this.animTimer) % anim.frames; }

            const sx = anim.x + (frame * anim.step);
            const sy = anim.y;
            const sw = anim.w;
            const sh = anim.h;
            const dw = 42, dh = 42; // Tamaño ajustado para 32x32

            ctx.save();
            if(this.dir === -1) {
                ctx.translate(this.x - cx, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(wizardSheet, sx, sy, sw, sh, -dw/2, this.y - cy - dh + 8, dw, dh);
            } else {
                ctx.drawImage(wizardSheet, sx, sy, sw, sh, this.x - cx - dw/2, this.y - cy - dh + 8, dw, dh);
            }
            ctx.restore();
        }
        
        // Staff Glow
        if (staffGlowTime > 0) {
            const tipX = Math.round(this.x - cx) + (this.dir === 1 ? 9 : -9);
            const tipY = Math.round(this.y - cy) - 50 - bob;
            const alpha = Math.min(1, staffGlowTime) * (0.6 + 0.4 * Math.sin(performance.now() / 120));
            
            const grd = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, 16);
            grd.addColorStop(0, `rgba(251,191,36,${alpha})`);
            grd.addColorStop(0.4, `rgba(251,191,36,${alpha * 0.5})`);
            grd.addColorStop(1, 'rgba(251,191,36,0)');
            ctx.fillStyle = grd;
            ctx.fillRect(tipX - 16, tipY - 16, 32, 32);
            ctx.fillStyle = `rgba(255,240,100,${alpha})`;
            ctx.fillRect(tipX - 2, tipY - 2, 4, 4);
        }
    }
};

    gameState = 'DIALOG';
    modalBg.classList.remove('hidden');
    modalBg.style.display = 'flex';
    void modalBg.offsetWidth;
    modalBg.style.opacity = '1';

    if(isDanger) modalBox.classList.add('danger'); else modalBox.classList.remove('danger');
    mTitle.textContent = title;
    mOpts.innerHTML = '';
    mText.innerHTML = '';

    let i = 0;
    let currentHTML = "";
    clearInterval(typewriterTimer);
    typewriterTimer = setInterval(() => {
        let isTag = false;
        if (text.charAt(i) === '<') {
            isTag = true;
            const end = text.indexOf('>', i);
            if (end !== -1) {
                currentHTML += text.substring(i, end + 1);
                i = end + 1;
            } else {
                currentHTML += text.charAt(i); i++;
            }
        } else {
            if(text.charAt(i) !== ' ' && gameState === 'DIALOG') playBlip();
            currentHTML += text.charAt(i);
            i++;
        }
        mText.innerHTML = currentHTML;
        
        if(i >= text.length) {
            clearInterval(typewriterTimer);
            renderOptions(options);
        }
    }, 18);
}

function hideModal(callback) {
    modalBg.style.opacity = '0';
    setTimeout(() => {
        modalBg.style.display = 'none';
        if (callback) callback();
    }, 190);
}

function renderOptions(options) {
    if(!options) {
        const b = document.createElement('button');
        b.className = 'btn center'; b.textContent = 'Continuar';
        b.onclick = () => hideModal(() => { if(gameState !== 'GAMEOVER') gameState = 'PLAY'; });
        mOpts.appendChild(b);
        return;
    }
    options.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'btn'; b.textContent = opt.t;
        b.onclick = () => handleAnswer(opt.c);
        mOpts.appendChild(b);
    });
}

function handleAnswer(isCorrect) {
    hideModal(() => {
        if(isCorrect) {
            if(currentDialog.type === 'chest') {
                const id = currentDialog.id;
                gems[id] = true;
                currentDialog.opened = true;
                const gemEl = document.getElementById(id);
                gemEl.classList.add('active');
                gemEl.classList.add('collected');
                
                const attempts = attemptCount[id] || 0;
                const tryTxt = attempts > 0 ? `<br><br><i>Conseguido tras ${attempts} intentos fallidos.</i>` : '';
                
                staffGlowTime = 3.0;
                playSound('gem');
                emitParticles(currentDialog.x, currentDialog.y, 40, ['#fbbf24','#fff','#38bdf8']);
                showModal('¡Correcto!', 'Adquieres una Gema de Sabiduría.' + tryTxt, false, null);
            } else if(currentDialog.type === 'dragon') {
                if(!currentDialog.phase2) {
                    currentDialog.phase2 = true;
                    showModal('¡El Dragón Tiembla!', currentDialog.phase2Text, true, currentDialog.phase2Opts);
                    triggerScreenShake();
                    shakeTime = 0.5;
                    playSound('dragon');
                    emitParticles(currentDialog.x, currentDialog.y, 60, ['#ef4444','#fbbf24','#fff']);
                } else {
                    emitParticles(currentDialog.x, currentDialog.y, 150, ['#fbbf24','#fff','#10b981','#38bdf8']);
                    currentDialog.defeated = true;
                    gameState = 'GAMEOVER';
                    playSound('gem');
                    showModal('¡VICTORIA ÉPICA!', '¡El poder de la Regularización y Validación Bayesiana ha purificado al Dragón del Overfitting!<br><br>Has dominado el Arte del Análisis Multinivel.', false, null);
                }
            }
        } else {
            triggerScreenShake();
            const id = currentDialog.id;
            const hw = player.w/2, hh = player.h/2;
            const nx = player.x;
            const ny = player.y + 35;
            
            const def = LEVEL_DEFS[currentLevelId];
            let canMoveX = nx > TSIZE + hw && nx < def.mapW * TSIZE - TSIZE - hw;
            let canMoveY = ny > TSIZE + hh && ny < def.mapH * TSIZE - TSIZE - hh;
            
            // Colisiones con paredes internas 3D
            if(def.internalWalls) {
                def.internalWalls.forEach(w => {
                    const wx = w.c * TSIZE; const wy = w.r * TSIZE;
                    const ww = w.w * TSIZE; const wh = w.h * TSIZE;
                    if(nx + hw > wx && nx - hw < wx + ww && player.y + hh > wy && player.y - hh < wy + wh) canMoveX = false;
                    if(player.x + hw > wx && player.x - hw < wx + ww && ny + hh > wy && ny - hh < wy + wh) canMoveY = false;
                });
            }
            
            if(canMoveX) player.x = nx;
            if(canMoveY) player.y = ny;
            
            player.x = Math.max(TSIZE+hw, Math.min(player.x, def.mapW*TSIZE - TSIZE - hw));
            player.y = Math.max(TSIZE+hh, Math.min(player.y, def.mapH*TSIZE - TSIZE - hh));
            
            if(id) attemptCount[id] = (attemptCount[id] || 0) + 1;
            showModal('¡INCORRECTO!', 'Tus parámetros han sido sobreajustados... Inténtalo de nuevo.', true, null);
        }
    });
}

function gotoLevel(id) {
    if(id === 'dragon' && !hasAllGems()) {
        showModal('La Sala está Sellada', 'Necesitas las 5 Gemas de Sabiduría para enfrentarte al Dragón del Overfitting.', true, null);
        return;
    }
    initAudio(); // Inicia ambient si no ha iniciado
    gameState = 'TRANSITION';
    transitionPhase = 'out';
    pendingLevelId = id;
}

function loadLevel(id) {
    currentLevelId = id;
    const def = LEVEL_DEFS[id];
    activeEntities = JSON.parse(JSON.stringify(def.entities)); // deep copy state
    player.x = def.playerStart.x;
    player.y = def.playerStart.y;
    cameraX = camTargetX = Math.max(0, player.x - CW/2);
    cameraY = camTargetY = Math.max(0, player.y - CH/2);
    if(def.init) def.init();
    updateDoorLabels();
}

function updateDoorLabels() {
    doorLabelsContainer.innerHTML = '';
    const wrapperRect = document.getElementById('game-wrapper').getBoundingClientRect();
    const canvasRect = canvas.getBoundingClientRect();
    const scaleX = canvasRect.width / CW;
    const scaleY = canvasRect.height / CH;

    activeEntities.forEach(ent => {
        if(ent.type === 'door' && ent.label) {
            const div = document.createElement('div');
            div.className = 'door-glyph';
            div.textContent = ent.label;
            // Posicionamiento se hará en draw() dinámicamente
            div.id = 'lbl_' + ent.target;
            div.style.color = ent.color;
            doorLabelsContainer.appendChild(div);
        }
    });
}

function positionLabels(scx, scy) {
    const scale = canvas.getBoundingClientRect().width / CW;
    activeEntities.forEach(ent => {
        if(ent.type === 'door' && ent.label) {
            const el = document.getElementById('lbl_' + ent.target);
            if(el) {
                const px = (ent.x - scx) * scale;
                const py = (ent.y - scy - 40) * scale;
                el.style.left = px + 'px';
                el.style.top = py + 'px';
            }
        }
    });
}

/* === DRAWING UTILS === */
function drawLighting(ctx, scx, scy) {
    const def = LEVEL_DEFS[currentLevelId];
    
    // Vignette base con tinte temático
    const grad = ctx.createRadialGradient(CW/2, CH/2, CH/3, CW/2, CH/2, CW*0.8);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, def.light || 'rgba(0,0,0,0.6)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,CW,CH);

    // Spotlight del jugador — luz cálida de linterna (no blanco puro)
    const px = player.x - scx; const py = player.y - scy - 10;
    const lightColor = def.playerLight || '200,170,100';
    const pLight = ctx.createRadialGradient(px, py, 8, px, py, 140);
    pLight.addColorStop(0, `rgba(${lightColor},0.10)`);
    pLight.addColorStop(0.5, `rgba(${lightColor},0.04)`);
    pLight.addColorStop(1, `rgba(${lightColor},0)`);
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = pLight;
    ctx.fillRect(px-150, py-150, 300, 300);

    // Luces de antorcha / ambiente pulsante
    if(currentLevelId === 'hub' || currentLevelId === 'level5' || currentLevelId === 'dragon') {
        const flicker = Math.sin(performance.now()/150)*0.04;
        const color = currentLevelId === 'hub' ? '255,160,40' : '255,50,50';
        const tPos = currentLevelId === 'hub' ? [[TSIZE*2, TSIZE*2], [TSIZE*28, TSIZE*2]] : [[player.x-scx, player.y-scy]];
        
        tPos.forEach(p => {
            const tx = p[0]; const ty = p[1];
            const tLight = ctx.createRadialGradient(tx, ty, 5, tx, ty, 130);
            tLight.addColorStop(0, `rgba(${color},${0.25+flicker})`);
            tLight.addColorStop(1, `rgba(${color},0)`);
            ctx.fillStyle = tLight;
            ctx.fillRect(tx-130, ty-130, 260, 260);
        });
    }
    ctx.globalCompositeOperation = 'source-over';
}

function drawMap(ctx, def, scx, scy) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CW, CH);
    
    const startCol = Math.max(0, Math.floor(scx / TSIZE));
    const endCol = Math.min(def.mapW, Math.ceil((scx + CW) / TSIZE));
    const startRow = Math.max(0, Math.floor(scy / TSIZE));
    const endRow = Math.min(def.mapH, Math.ceil((scy + CH) / TSIZE));

    const wallHeight = 24; // Altura de la cara frontal de las paredes 3D

    // 1. DIBUJAR SUELO (Piso)
    for (let r = startRow; r < endRow; r++) {
        for (let c = startCol; c < endCol; c++) {
            const tx = c * TSIZE - scx;
            const ty = r * TSIZE - scy;
            let isWall = (r===0 || r===def.mapH-1 || c===0 || c===def.mapW-1);
            if(def.internalWalls) {
                def.internalWalls.forEach(w => {
                    if(r >= w.r && r < w.r + w.h && c >= w.c && c < w.c + w.w) isWall = true;
                });
            }
            if(!isWall) {
                if(currentLevelId === 'hub') {
                    ctx.fillStyle = ((r+c)%2===0) ? '#15151a' : '#1a1a20';
                    ctx.fillRect(tx, ty, TSIZE, TSIZE);
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(tx+4, ty+4); ctx.lineTo(tx+12, ty+4);
                    ctx.moveTo(tx+20, ty+10); ctx.lineTo(tx+28, ty+10);
                    ctx.stroke();
                } else if(currentLevelId === 'level1') {
                    ctx.fillStyle = ((r+c)%2===0) ? def.f0 : def.f1;
                    ctx.fillRect(tx, ty, TSIZE, TSIZE);
                    ctx.fillStyle = 'rgba(56,189,248,0.05)';
                    ctx.fillRect(tx+14, ty+14, 4, 4);
                } else if(currentLevelId === 'level2') {
                    ctx.fillStyle = ((r+c)%2===0) ? def.f0 : def.f1;
                    ctx.fillRect(tx, ty, TSIZE, TSIZE);
                    ctx.strokeStyle = 'rgba(168,85,247,0.1)';
                    ctx.strokeRect(tx+4, ty+4, TSIZE-8, TSIZE-8);
                } else if(currentLevelId === 'level3') {
                    ctx.fillStyle = ((r+c)%2===0) ? def.f0 : def.f1;
                    ctx.fillRect(tx, ty, TSIZE, TSIZE);
                    ctx.fillStyle = 'rgba(16,185,129,0.05)';
                    if(Math.random() > 0.8) ctx.fillRect(tx, ty, TSIZE, TSIZE); // musgo sutil
                } else {
                    ctx.fillStyle = ((r+c)%2===0) ? def.f0 : def.f1;
                    ctx.fillRect(tx, ty, TSIZE, TSIZE);
                }
                ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                ctx.strokeRect(tx, ty, TSIZE, TSIZE);
            }
        }
    }

    // 2. DIBUJAR PAREDES 2.5D (De arriba hacia abajo para el Y-Sorting natural del mapa)
    for (let r = startRow; r < endRow; r++) {
        for (let c = startCol; c < endCol; c++) {
            const tx = c * TSIZE - scx;
            const ty = r * TSIZE - scy;
            let isWall = (r===0 || r===def.mapH-1 || c===0 || c===def.mapW-1);
            if(def.internalWalls) {
                def.internalWalls.forEach(w => {
                    if(r >= w.r && r < w.r + w.h && c >= w.c && c < w.c + w.w) isWall = true;
                });
            }
            if(isWall) {
                // Cara superior con textura de piedra (00.png) si está cargada
                if(wallTexReady) {
                    ctx.globalAlpha = 0.55;
                    ctx.drawImage(wallTexImg, tx, ty - wallHeight, TSIZE, TSIZE);
                    ctx.globalAlpha = 1;
                    // Tinte temático del nivel sobre la textura
                    ctx.fillStyle = def.wallTint || 'rgba(0,0,0,0.3)';
                    ctx.fillRect(tx, ty - wallHeight, TSIZE, TSIZE);
                } else {
                    ctx.fillStyle = def.wallTint || 'rgba(100,90,80,0.2)';
                    ctx.fillRect(tx, ty - wallHeight, TSIZE, TSIZE);
                }

                // Cara frontal
                ctx.fillStyle = def.wall;
                ctx.fillRect(tx, ty - wallHeight + TSIZE, TSIZE, wallHeight);

                // Borde superior — color temático sutil (no blanco)
                ctx.fillStyle = def.wallEdge || 'rgba(140,120,90,0.5)';
                ctx.fillRect(tx, ty - wallHeight + TSIZE, TSIZE, 2);
            }
        }
    }
    
    if(def.decor) def.decor(ctx, scx, scy);
}

/* === MAIN LOOP === */
let actionPressed = false;

function update(dt) {
    if(gameState === 'TRANSITION') {
        if(transitionPhase === 'out') {
            transitionAlpha += dt * 3;
            if(transitionAlpha >= 1) {
                transitionAlpha = 1;
                loadLevel(pendingLevelId);
                transitionPhase = 'in';
            }
        } else if(transitionPhase === 'in') {
            transitionAlpha -= dt * 3;
            if(transitionAlpha <= 0) {
                transitionAlpha = 0;
                transitionPhase = null;
                if(!welcomeShown) {
                    welcomeShown = true;
                    showModal('Reto Bayesiano', 'Presiona cualquier tecla o toca la pantalla para iniciar.<br><br>Explora las 5 salas, recupera las Gemas de la Sabiduría Bayesiana y derrota al Dragón del Overfitting.', false, null);
                } else {
                    gameState = 'PLAY';
                }
            }
        }
        return;
    }

    if(gameState !== 'PLAY') return;

    initAudio();
    player.update(dt);
    if(staffGlowTime > 0) staffGlowTime = Math.max(0, staffGlowTime - dt);

    const def = LEVEL_DEFS[currentLevelId];
    if(def.update) def.update(dt);

    camTargetX = Math.max(0, Math.min(player.x - CW/2, def.mapW*TSIZE - CW));
    camTargetY = Math.max(0, Math.min(player.y - CH/2, def.mapH*TSIZE - CH));
    cameraX += (camTargetX - cameraX) * CAM_LERP;
    cameraY += (camTargetY - cameraY) * CAM_LERP;

    const isAction = keys.action || touches.action;
    if(isAction && !actionPressed) {
        actionPressed = true;
        for(let ent of activeEntities) {
            if(dist(player.x, player.y, ent.x, ent.y) < ent.r) {
                if(ent.type === 'door') {
                    if(ent.requiresAll && !hasAllGems()) {
                        showModal('La Sala está Sellada', 'Necesitas las 5 Gemas de Sabiduría para enfrentarte al Dragón del Overfitting.', true, null);
                    } else {
                        gotoLevel(ent.target);
                    }
                } else if(ent.type === 'chest' && !gems[ent.id]) {
                    currentDialog = ent;
                    showModal(ent.title, ent.text, false, ent.opts);
                } else if(ent.type === 'dragon' && !ent.defeated) {
                    currentDialog = ent;
                    showModal(ent.title, ent.text, true, ent.opts);
                }
            }
        }
    }
    if(!isAction) actionPressed = false;

    updateParticles(dt);
}

function draw() {
    const def = LEVEL_DEFS[currentLevelId];
    drawMap(ctx, def, cameraX, cameraY);

    // Y-SORTING: Ordenar todas las entidades y el jugador por su coordenada Y
    let renderables = [...activeEntities];
    renderables.push({ type: 'player', y: player.y });
    renderables.sort((a, b) => (a.y + (a.depthOffset||0)) - (b.y + (b.depthOffset||0)));

    renderables.forEach(ent => {
        if(ent.type === 'player') {
            player.draw(ctx, cameraX, cameraY);
        } else if(ent.type === 'chest') {
            drawChestSprite(ctx, ent.x - cameraX, ent.y - cameraY, !!gems[ent.id]);
        } else if(ent.type === 'door') {
            const glow = Math.sin(performance.now()/200)*0.2 + 0.8;
            ctx.save();
            if(ent.customImg && castleDoorImg.complete) {
                const dw = 64, dh = 80;
                ctx.drawImage(castleDoorImg, ent.x - cameraX - dw/2, ent.y - cameraY - dh + 10, dw, dh);
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = ent.color; ctx.globalAlpha = 0.2 * glow;
                ctx.fillRect(ent.x - cameraX - dw/2, ent.y - cameraY - dh + 10, dw, dh);
            } else {
                ctx.globalAlpha = glow;
                renderSprite(ctx, SPRITES.door, ent.x - cameraX, ent.y - cameraY, false, 2, ent.color);
            }
            ctx.restore();
            ctx.fillStyle = ent.color; ctx.globalAlpha = 0.15 * glow;
            ctx.beginPath(); ctx.ellipse(ent.x - cameraX, ent.y - cameraY, 40, 15, 0, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1;
        } else if(ent.type === 'dragon' && !ent.defeated) {
            if(dragonLoadedCount < 3) {
                renderSprite(ctx, SPRITES.dragon, ent.x - cameraX, ent.y - cameraY, ent.phase2, 2.5);
            } else {
                const t = performance.now()/1000;
                const bob = Math.sin(t*2.5)*8; // Animación de respiración suave
                
                let img = dragonIdleImg;
                if(ent.phase2) {
                    img = dragonAttackImg;
                } else {
                    // Seguir al jugador con la mirada
                    if(player.x < ent.x) img = dragonLeftImg;
                    else img = dragonIdleImg;
                }
                
                // Escalar manteniendo proporción (aprox 0.7 de su tamaño original para que sea imponente)
                const scale = 0.75;
                const dw = img.width * scale; 
                const dh = img.height * scale;
                
                ctx.save();
                // Sombra dinámica que pulsa con la respiración
                const shadowW = 100 + Math.sin(t*2.5)*10;
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath(); 
                ctx.ellipse(ent.x - cameraX, ent.y - cameraY + 20, shadowW/2, 25, 0, 0, Math.PI*2); 
                ctx.fill();
                
                // Dibujar Dragón centrado
                ctx.drawImage(img, ent.x - cameraX - dw/2, ent.y - cameraY - dh + 30 + bob, dw, dh);
                
                // Aura de calor/fuego si está en fase 2
                if(ent.phase2) {
                    const heat = Math.abs(Math.sin(t*10)) * 0.2;
                    ctx.globalCompositeOperation = 'screen';
                    ctx.fillStyle = `rgba(255,100,50,${0.1 + heat})`;
                    ctx.beginPath();
                    ctx.arc(ent.x - cameraX, ent.y - cameraY - dh/2, 80, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.restore();
            }
        } else if(ent.type === 'floating_lamp') {
            const t = performance.now()/1000;
            const floatBob = Math.sin(t*3 + ent.x)*8;
            const shadowSize = 15 - Math.sin(t*3 + ent.x)*3;
            
            // Sombra en el suelo
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath(); ctx.ellipse(ent.x - cameraX, ent.y - cameraY, shadowSize, shadowSize/2, 0, 0, Math.PI*2); ctx.fill();
            
            // Lámpara
            const img = ent.color === 'blue' ? lampHangingBlueImg : lampHangingBronzeImg;
            if(lampHangingBlueImg.complete && lampHangingBronzeImg.complete) {
                const w = 32, h = 32;
                ctx.drawImage(img, ent.x - cameraX - w/2, ent.y - cameraY - h*2 + floatBob, w, h);
                
                // Brillo dinámico
                const glow = Math.sin(t * 3 + ent.x) * 0.15 + 0.35;
                const auraColor = ent.color === 'blue' ? '56, 189, 248' : '251, 191, 36';
                const gradient = ctx.createRadialGradient(ent.x-cameraX, ent.y-cameraY-h*1.5+floatBob, 0, ent.x-cameraX, ent.y-cameraY-h*1.5+floatBob, 60);
                gradient.addColorStop(0, `rgba(${auraColor}, ${glow})`);
                gradient.addColorStop(1, `rgba(${auraColor}, 0)`);
                ctx.fillStyle = gradient;
                ctx.beginPath(); ctx.arc(ent.x-cameraX, ent.y-cameraY-h*1.5+floatBob, 60, 0, Math.PI*2); ctx.fill();
            }
        } else if(ent.type === 'decor') {
            let img = swordStoneImg;
            if(ent.img === 'gargoyle') img = gargoyleImg;
            if(ent.img === 'candelabra') img = candelabraImg;
            if(ent.img === 'cage') img = cageImg;
            if(ent.img === 'mushrooms') img = mushroomsImg;
            if(sceneryLoaded >= 5) {
                const w = img.width * ent.scale;
                const h = img.height * ent.scale;
                
                // Sombra base
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath(); ctx.ellipse(ent.x - cameraX, ent.y - cameraY, w/3, 8, 0, 0, Math.PI*2); ctx.fill();
                
                ctx.save();
                if(ent.flip) {
                    ctx.translate(ent.x - cameraX, 0); ctx.scale(-1, 1);
                    ctx.drawImage(img, -w/2, ent.y - cameraY - h + (ent.depthOffset||0), w, h);
                } else {
                    ctx.drawImage(img, ent.x - cameraX - w/2, ent.y - cameraY - h + (ent.depthOffset||0), w, h);
                }
                ctx.restore();
            }
        }
    });

    drawParticles(cameraX, cameraY);
    drawLighting(ctx, cameraX, cameraY);

    if(transitionAlpha > 0) {
        ctx.fillStyle = `rgba(0,0,0,${transitionAlpha})`;
        ctx.fillRect(0,0,CW,CH);
    }
    
    positionLabels(cameraX, cameraY);
}

function loop() {
    const now = performance.now();
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.1) dt = 0.1;
    accumulator += dt;
    while (accumulator >= FIXED_DT) {
        update(FIXED_DT);
        accumulator -= FIXED_DT;
    }
    draw();
    requestAnimationFrame(loop);
}

loadLevel('hub');
requestAnimationFrame(loop);

</script>
